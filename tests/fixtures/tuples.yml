openapi: 3.1.0
info:
  title: Tuples Fixture
  version: 1.0.0
paths:
  /pairs:
    get:
      operationId: getPairs
      tags: [Pairs]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairList'
components:
  schemas:
    User:
      type: object
      properties:
        id: {type: string}
    Tag:
      type: object
      properties:
        label: {type: string}
    PairList:
      type: object
      required:
        - pairs
      properties:
        pairs:
          type: array
          prefixItems:
            - type: string
            - type: integer
    # A tuple whose members are `$ref`s. The model file renders
    # `pair: [User, Tag]`, so both referenced declarations must be imported;
    # without the import the file fails with TS2304.
    UserTagPair:
      type: object
      required:
        - pair
      properties:
        pair:
          type: array
          prefixItems:
            - $ref: '#/components/schemas/User'
            - $ref: '#/components/schemas/Tag'
